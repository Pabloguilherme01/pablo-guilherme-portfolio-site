name: Deploy portfolio artifact to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - ".nojekyll"
      - "SOURCE_COMMIT"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -d assets
          test ! -f package.json
          test ! -d src
          if [ -f SOURCE_COMMIT ]; then
            grep -Eq '^[0-9a-f]{40}$' SOURCE_COMMIT
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
